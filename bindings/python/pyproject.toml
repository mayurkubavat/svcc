# Maturin / PyO3 build manifest for the `svcc` Python package (`pip install svcc`).

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "svcc"
version = "0.1.0"
description = "SystemVerilog RTL to SystemC conversion with Z3 equivalence checks (Python bindings)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mayur Kubavat" }]
keywords = ["systemverilog", "systemc", "uvm", "eda", "formal-verification", "rtl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Repository = "https://github.com/mayurkubavat/svcc"
Documentation = "https://github.com/mayurkubavat/svcc/blob/main/docs/rtl_subset.md"

[tool.maturin]
bindings = "pyo3"
module-name = "svcc"
strip = true
