# Maturin / PyO3 build manifest for publishing `svcc` to PyPI (`pip install svcc`).
# Verified available on PyPI: https://pypi.org/project/svcc/ (unclaimed as of 2026-11-21)

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "svcc"
version = "0.2.0"
description = "Bidirectional IEEE 1800-2023 SystemVerilog <-> C++17 SystemC/UVM Compiler & Z3 Equivalence Prover"
readme = "../../README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Mayur Kubavat" }]
keywords = ["systemverilog", "systemc", "uvm", "eda", "formal-verification", "rtl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[tool.maturin]
bindings = "pyo3"
module-name = "svcc"
strip = true
