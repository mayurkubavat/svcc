[package]
name = "svcc-py"
version = "0.1.3"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "PyO3 Python bindings (`import svcc`) for svcc: SystemVerilog RTL to SystemC conversion and Z3 checks"

[workspace]

[lib]
name = "svcc"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24", features = ["abi3-py39", "extension-module"] }
serde_json = "1.0"
svcc = { path = "../../crates/svcc" }
