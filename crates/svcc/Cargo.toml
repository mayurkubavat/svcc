[package]
name = "svcc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
exclude = ["tests/"]
description = "Converts synthesizable SystemVerilog RTL to readable SystemC and checks the generated C++ against the source with Z3"

[lib]
name = "svcc"
path = "src/lib.rs"

[[bin]]
name = "svcc"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
svcc-ir.workspace = true
svcc-front-sv.workspace = true
svcc-front-sc.workspace = true
svcc-passes.workspace = true
svcc-equiv.workspace = true
svcc-emit-sc.workspace = true
svcc-emit-sv.workspace = true
