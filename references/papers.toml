# Related-work library for svcc. Single source of truth: edit this file, then run
#   python3 scripts/refs.py all      (validate, regenerate INDEX.md and survey.bib)
#   python3 scripts/refs.py fetch    (download open-access PDFs into references/pdfs/, gitignored)
#
# Fields: key (BibTeX key), section, priority (core | related | background), title, authors,
# year, venue, type (BibTeX entry type), url (landing page), note (relevance to svcc).
# Optional: doi, arxiv, pages, publisher, pdf_url (direct legal open-access PDF; fetched),
# oa_page (open copy that is not a direct PDF link), in_paper (key already in paper/refs.bib).

[[section]]
id = "synth"
title = "Synthesizable subsets and SystemC-to-RTL translation"
blurb = "The top priority for svcc: what the synthesizable subsets of SystemC (IEEE 1666.1) and SystemVerilog actually are, and the tools that translate cycle-accurate SystemC into RTL. These define the constructs a design-model conversion must accept, reject, or lower."

[[section]]
id = "sem"
title = "Formal and simulation semantics of Verilog and SystemC"
blurb = "Accurate conversion needs a precise account of both sides' scheduling semantics: blocking versus nonblocking assignment, delta cycles, four-state values, and where simulation and synthesis disagree."

[[section]]
id = "sv2c"
title = "HDL-to-SystemC and HDL-to-C++ translation"
blurb = "Prior tools that go in svcc's SV-to-SystemC direction: RTL-to-SystemC converters, RTL-to-TLM abstraction, and RTL-to-C/C++ compilers used for simulation or verification."

[[section]]
id = "ec"
title = "C/SystemC-to-RTL equivalence checking and SystemC formal verification"
blurb = "Sequential equivalence checking between system-level models and RTL (the C2RTL / SLEC line that svcc's Btor2 SEC follows), the solvers and model checkers behind it, and formal analysis of SystemC itself."

[[section]]
id = "tv"
title = "Translation validation and compiler correctness"
blurb = "Per-run validation of a compiler's output versus verified compilers, applied to software compilers and to HLS. This is the methodological basis for svcc's checked translation."

[[section]]
id = "hls"
title = "High-level synthesis"
blurb = "Surveys and representative HLS tools. Useful for the C++ coding restrictions HLS imposes and for where untimed synthesis differs from the cycle-accurate subset svcc targets first."

[[section]]
id = "ir"
title = "Hardware IRs and compiler infrastructure"
blurb = "Multi-level and multi-dialect IRs for hardware, the design space svcc-ir sits in."

[[section]]
id = "dv"
title = "UVM-SystemC, constrained random and coverage"
blurb = "The DV-modeling side: UVM in SystemC, CRAVE, FC4SC, and mixed SV/SystemC verification flows."

[[section]]
id = "llm"
title = "LLM-based RTL generation and translation"
blurb = "Learned approaches to the same translation problems. Relevant as baselines and as the consumers of a checked translator."

[[section]]
id = "std"
title = "Standards, books and the author's own tools"
blurb = "Normative references and background cited by the paper."

